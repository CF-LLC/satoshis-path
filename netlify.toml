# Netlify build for https://satoshispath.netlify.app (static export, no basePath).
# GitHub Pages (cf-llc.github.io/satoshis-path) keeps building from .github/workflows/deploy.yml.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SITE_URL = "https://satoshispath.netlify.app"
  CHECKLIST_EMAIL_SEND_ENABLED = "false"

# Form-triggered function. Sending stays off unless CHECKLIST_EMAIL_SEND_ENABLED=true.
[functions]
  directory = "netlify/functions"
